name: facul-iot
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure o arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure o arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  ingest:
    build: .
    environment: &db_config
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./docs/resultados:/app/docs/resultados
    command: ["python", "-m", "src.pipeline", "--csv", "data/IOT-temp.csv"]
  dashboard:
    build: .
    environment: *db_config
    depends_on:
      ingest:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8501:8501"
    command: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0", "--browser.gatherUsageStats=false"]
volumes:
  postgres_data:
